[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "container-compose"
version = "0.1.0"
description = "A minimal Compose implementation for Apple `container`: reads docker-compose.yml and drives the container CLI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.scripts]
container-compose = "container_compose:main"

[tool.setuptools]
py-modules = ["container_compose"]
