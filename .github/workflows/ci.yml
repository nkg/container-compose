name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Pinned to ubuntu-24.04 rather than ubuntu-latest: the label moves to
# Ubuntu 26 on 2026-10-19 (actions/runner-images#14748), and a release
# workflow should not change OS underneath a tag. Bump deliberately.
#
# GitHub-hosted runners, deliberately. This repo is public: a fork PR runs
# whatever it likes inside the job, which is fine on a throwaway hosted VM
# and not fine on a self-hosted machine. (Before the move to a personal
# account and public visibility, this ran on an org's self-hosted pool,
# which a user-owned repo cannot reach anyway.)

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The floor the package declares, and the newest release.
        python: ["3.10", "3.14"]
    name: test (python ${{ matrix.python }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}

      - name: Run shellcheck
        run: shellcheck --severity=warning tests/*.sh

      # Installed the way consumers install it, so the console script and the
      # pyyaml dependency are exercised rather than the bare module.
      - name: Install
        run: python -m pip install --quiet .

      - name: Run tests
        run: bash tests/test_cli.sh
