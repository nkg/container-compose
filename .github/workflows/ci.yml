name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GitHub-hosted runners, deliberately. This repo is public: a fork PR runs
# whatever it likes inside the job, which is fine on a throwaway hosted VM
# and not fine on a self-hosted machine. (Before the move to a personal
# account and public visibility, this ran on an org's self-hosted pool,
# which a user-owned repo cannot reach anyway.)

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor the package declares, and the newest release.
        python: ["3.10", "3.14"]
    name: test (python ${{ matrix.python }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Run shellcheck
        run: shellcheck --severity=warning tests/*.sh

      # Installed the way consumers install it, so the console script and the
      # pyyaml dependency are exercised rather than the bare module.
      - name: Install
        run: python -m pip install --quiet .

      - name: Run tests
        run: bash tests/test_cli.sh
