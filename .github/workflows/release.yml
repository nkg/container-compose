name: Release

# Builds the sdist and wheel when a v* tag is pushed and attaches them to a
# GitHub release for that tag. It does not publish to PyPI: installs come
# from this repository (see the README).
#
# The tag must match pyproject.toml's version; the check below refuses to
# build a v0.2.0 tag from a 0.1.1 pyproject rather than publish a release
# whose name lies about its contents.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Tag matches pyproject version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [[ "$tag" != "$version" ]]; then
            echo "tag v$tag but pyproject.toml says $version" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --quiet build
          python -m build

      - name: Smoke-test the wheel
        run: |
          python -m pip install --quiet dist/*.whl
          container-compose --help >/dev/null
          cd tests/fixtures && container-compose config --quiet

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Create the GitHub release with the built files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
